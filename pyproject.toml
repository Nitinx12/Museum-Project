[project]
name = "museum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nitin", email = "nitin321x@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.3",
    "dbt-postgres>=1.11.0",
    "dotenv>=0.9.9",
    "duckdb>=1.5.5",
    "great-expectations>=1.21.0",
    "logging>=0.4.9.6",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas<3.0",
    "plotly>=7.0.0",
    "pyarrow>=25.0.1",
    "pymongo>=4.17.0",
    "pyspark>=4.2.0",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
museum = "museum:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
